<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة المرور المؤقتة | رفيق</title><link rel="stylesheet" href="/static/style.css"><style>@font-face{font-family:Thmanyah;src:url(/static/fonts/Thmanyah-Sans-Regular.otf)}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102b31;color:#f5f0df;font-family:Thmanyah,sans-serif}.temp-card{width:min(90vw,460px);padding:32px;box-sizing:border-box;border:1px solid #b79b5d;border-radius:20px;background:#17373c}h1{font-size:25px;color:#dbc78d;line-height:1.6}p{line-height:1.9}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border-radius:8px;border:1px solid #a3aaa6;background:white;color:#102b31}button{width:100%;padding:13px;margin-top:24px;border:0;border-radius:8px;background:#d5bb79;color:#102b31;font:inherit;font-weight:bold}#status{min-height:48px;margin:16px 0 0;color:#ffdfab}</style><main class="temp-card"><h1>اختر كلمة مرور خاصة بك</h1><p>كلمة المرور الحالية مؤقتة. غيّرها الآن قبل استخدام حسابك في رفيق.</p><form id="change"><label for="current">كلمة المرور المؤقتة</label><input id="current" type="password" autocomplete="current-password" required dir="ltr"><label for="new">كلمة المرور الجديدة</label><input id="new" type="password" autocomplete="new-password" minlength="8" required dir="ltr"><label for="confirm">تأكيد كلمة المرور الجديدة</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required dir="ltr"><p>استخدم 8 أحرف على الأقل، واختر كلمة تختلف عن المؤقتة.</p><button type="submit">حفظ كلمة المرور الجديدة</button><p id="status" role="status" aria-live="polite"></p></form></main><script src="/static/change-password.js"></script></html>
