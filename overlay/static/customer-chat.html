<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>محادثة خدمة العملاء | رفيق</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f5;color:#0a2530;font:17px system-ui,sans-serif}main{max-width:720px;margin:30px auto;padding:24px;background:white;border-radius:20px}h1{font-size:28px}.muted{color:#5d6e74;line-height:1.8}article{padding:14px 18px;border:1px solid #dbe4e4;margin:14px 0;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{background:#eef5f4;margin-inline-start:30px}textarea{width:100%;font:inherit;padding:14px;border:1px solid #c9d4d4;border-radius:12px;resize:vertical}button{background:#0a3c49;color:white;font:inherit;border:0;padding:12px 20px;border-radius:10px;cursor:pointer;margin-top:10px}button:disabled{opacity:.5}.error{color:#a22}@media(max-width:600px){main{margin:0;border-radius:0;min-height:100vh;padding:18px}}
</style></head><body><main><h1>محادثة خدمة العملاء</h1><p class="muted">مساعد آلي يجيب بالنصوص المعتمدة عند توفر إجابة مطابقة. الأسئلة الأخرى تُحفظ للمتابعة البشرية. تُحفظ رسائلك في رفيق لدى صاحب هذه الصفحة. لا ترسل كلمات مرور أو بيانات دفع أو معلومات حساسة.</p><div id="messages" aria-live="polite"></div><p id="status" class="muted" role="status"></p><form id="form"><label for="body">رسالتك</label><textarea id="body" rows="3" maxlength="4000" required></textarea><button id="send">إرسال</button> <button id="refresh" type="button">تحديث الردود</button></form><p class="muted">احتفظ بهذه النافذة لعرض الرد. لا تُنشأ حجوزات أو مدفوعات عبر هذه المحادثة.</p></main><script>
'use strict';
const key=location.pathname.split('/').pop(),store='cs-session:'+key;
let session='';try{session=sessionStorage.getItem(store)||'';}catch(e){}
const status=document.getElementById('status'),list=document.getElementById('messages');
function show(messages){list.replaceChildren();for(const m of messages){const a=document.createElement('article');a.textContent=m.body;list.append(a);if(m.reply){const b=document.createElement('article');b.className='reply';b.textContent=m.reply;list.append(b);}else{const p=document.createElement('p');p.className='muted';p.textContent='حُفظت الرسالة للمتابعة. لا توجد إجابة معتمدة مطابقة حالياً.';list.append(p);}}}
async function request(payload){document.getElementById('send').disabled=true;document.getElementById('refresh').disabled=true;try{const r=await fetch('/api/customer-chat/'+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,session})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الاتصال');session=d.session;try{sessionStorage.setItem(store,session);}catch(e){}show(d.messages);status.textContent='';status.className='muted';return true;}catch(e){status.textContent=e.message;status.className='error';return false;}finally{document.getElementById('send').disabled=false;document.getElementById('refresh').disabled=false;}}
let pending=null;
document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const body=document.getElementById('body');if(!body.value.trim())return;if(!pending||pending.body!==body.value)pending={body:body.value,request_id:crypto.randomUUID()};if(await request({action:'send',...pending})){body.value='';pending=null;}};
document.getElementById('refresh').onclick=()=>request({action:'read'});
request({action:'read'});
</script></body></html>
